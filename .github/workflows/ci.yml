name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  js:
    name: JS package · build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: node scripts/smoke-test.mjs

  dotnet:
    name: .NET package · build + cross-validate
    runs-on: ubuntu-latest
    needs: js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
      - run: npm ci
      - run: npm run build
      - run: node scripts/smoke-test.mjs        # produces tmp/ artifacts
      - run: dotnet build -c Release packages/dotnet/EgovHelper.Net
      - run: dotnet run --project packages/dotnet/EgovHelper.Net.Tests
